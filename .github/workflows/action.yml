env:
  ECR_REPOSITORY: ${{ secrets.ECR_REPO_NAME }}

name: Push the Docker image to AWS ECR Repo
on:
  workflow_dispatch:
    inputs:
      tf-cmd:
        description: 'The command to run terraform with'
        required: true
        default: 'plan'
        type: choice
        options:
          - plan
          - apply
  push:
    branches:
    - main
  
jobs:
  build:
    name: Build
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read
    steps:
      - name: Checkout Repo
        uses: actions/checkout@v4

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4.0.2
        with:
          role-to-assume: ${{ secrets.AWS_GH_ACTIONS_ROLE_ARN }}
          aws-region: ${{ secrets.AWS_REGION }}

      - name: Check privileged user
        if: ${{ github.event_name == 'push' }}
        id: priv-check
        working-directory: scripts
        run: |
          echo "is_priv=$(./check-privileged-user.sh ${{ github.event.pusher.name }})" >> $GITHUB_OUTPUT
          if [ "$is_priv" = true ]; then
            echo "${{ github.event.pusher.name }} is a privileged user."
          else
            echo "${{ github.event.pusher.name }} is not a privileged user."
          fi   

      - name: Login to ECR
        if: ${{ github.event_name == 'push' }}
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2.0.1
      
      - name: Build, tag and push image to ECR
        if: ${{ github.event_name == 'push' }}
        id: build-image
        env:
            ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
            IMAGE_TAG: latest
        run: |
          docker build -t $ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG .
          docker push $ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG

      - name: Remove untagged images from ECR
        if: ${{ github.event_name == 'push' }}
        run: |
          IMAGES_TO_DELETE=$( aws ecr list-images --region ${{ secrets.AWS_REGION }} --repository-name ${{ secrets.ECR_REPO_NAME }} --filter "tagStatus=UNTAGGED" --query 'imageIds[*]' --output json )
          aws ecr batch-delete-image --region ${{ secrets.AWS_REGION }} --repository-name ${{ secrets.ECR_REPO_NAME }} --image-ids "$IMAGES_TO_DELETE" || true

      - name: HashiCorp - Setup Terraform
        uses: hashicorp/setup-terraform@v3.1.2

      - name: Initialize terraform
        working-directory: scripts/terraform
        run: terraform init
      
      - name: Run terraform plan
        if: ${{ github.event_name == 'push' || github.event.inputs.tf-cmd == 'plan' }}
        working-directory: scripts
        run: ./terraform-check.sh
      
      - name: Run terraform apply
        if: ${{ ( github.event_name == 'push' || github.event.inputs.tf-cmd == 'apply' ) && steps.priv-check.outputs.is_priv == 'true' }}
        working-directory: scripts/terraform
        run: terraform apply -auto-approve