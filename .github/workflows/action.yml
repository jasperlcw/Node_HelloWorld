name: Push the Docker image to AWS ECR Repo and Deploy to ECS
on:
  workflow_dispatch:
    inputs:
      tf-cmd:
        description: 'The command to run terraform with'
        required: true
        default: 'plan'
        type: choice
        options:
          - plan
          - apply
  push:
    branches:
    - main

permissions:
  id-token: write
  contents: read

env:
  AWS_REGION: ${{ secrets.AWS_REGION }}

jobs:
  aws-docker:
    name: Create and Publish Docker image on AWS ECR
    runs-on: ubuntu-latest
    outputs:
      IMAGE_TAG: ${{ steps.build-image.outputs.image_tag }}
    steps:
      - name: Checkout Repo
        uses: actions/checkout@v4

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4.0.2
        with:
          role-to-assume: ${{ secrets.AWS_GH_ACTIONS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Login to ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2.0.1
      
      - name: Build, tag and push image to ECR
        id: build-image
        env:
            ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
            ECR_REPOSITORY: ${{ secrets.ECR_REPO_NAME }}
            IMAGE_TAG: ${{ github.sha }}
        run: |
          docker build -t $ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG .
          docker push $ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG
          echo "image_tag=$IMAGE_TAG" >> $GITHUB_OUTPUT
      
  aws-deploy:
    name: Deploy to AWS via Terraform
    needs: [aws-docker]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repo
        uses: actions/checkout@v4

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4.0.2
        with:
          role-to-assume: ${{ secrets.AWS_GH_ACTIONS_ROLE_ARN }}
          aws-region: ${{ secrets.AWS_REGION }}

      - name: HashiCorp - Setup Terraform
        uses: hashicorp/setup-terraform@v3.1.2
  
      - name: Initialize terraform
        working-directory: scripts/terraform
        run: terraform init

      - name: Check privileged user
        id: priv-check
        working-directory: scripts
        run: |
          is_priv=$(./check-privileged-user.sh ${{ github.triggering_actor }} ${{ secrets.REPO_AUTHORIZED_USERS }})
          echo "is_priv=$is_priv" >> $GITHUB_OUTPUT
          if [ "$is_priv" = "true" ]; then
            echo "${{ github.triggering_actor }} is a privileged user."
            echo "Skipping terraform plan step."
          else
            echo "${{ github.triggering_actor }} is not a privileged user."
          fi

      - name: Run terraform plan
        id: tf-plan
        if: ${{ !(steps.priv-check.outputs.is_priv == 'true') && (github.event_name == 'push' || github.event.inputs.tf-cmd == 'plan') }}
        working-directory: scripts
        run: |
          echo "clean_deploy=$(./tf-plan-script.sh ${{ needs.aws-docker.outputs.IMAGE_TAG }})" >> $GITHUB_OUTPUT
          cat temp-msg.txt
          rm temp-msg.txt
      
      - name: Run terraform apply
        if: ${{ (steps.priv-check.outputs.is_priv == 'true') || (steps.tf-plan.outputs.clean_deploy == 'true') || (github.event.inputs.tf-cmd == 'apply') }}
        working-directory: scripts
        run: |
          clean_deploy=${{ steps.tf-plan.outputs.clean_deploy }}
          priv_user=${{ steps.priv-check.outputs.is_priv }}
          ./tf-apply-script.sh $clean_deploy $priv_user ${{ needs.aws-docker.outputs.IMAGE_TAG }}
          